name: iOS build check

# Manual / path-scoped so it doesn't burn macOS minutes on every push.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "ios/**"
      - "capacitor.config.ts"
      - ".github/workflows/ios-build.yml"

jobs:
  build:
    # macos-15 ships Xcode 16 by default; Capacitor 8 requires Xcode 16+.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22 # Capacitor CLI 8 requires Node >= 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Copy web assets + native config into the committed iOS project.
      - run: npx cap sync ios
      # Compile for the simulator, unsigned — proves the native app builds
      # without needing Apple signing secrets.
      - name: Build (iphonesimulator, unsigned)
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
